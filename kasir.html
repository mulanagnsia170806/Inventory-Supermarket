
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modul Kasir | StockPilot</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <!-- CSS proyek yang sudah tersedia -->
  <link rel="stylesheet" href="css/style.css">

  <!-- CSS tambahan khusus halaman kasir -->
  <style>
    .kasir-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr);
      gap: 24px;
    }

    .kasir-card {
      background: #fff;
      border: 1px solid #f0dfe7;
      border-radius: 16px;
      padding: 20px;
    }

    .produk-card {
      border: 1px solid #f0dfe7;
      border-radius: 12px;
      padding: 16px;
      height: 100%;
      transition: .2s;
    }

    .produk-card:hover {
      border-color: #d88fa8;
      transform: translateY(-2px);
    }

    .btn-kasir {
      background: #d88fa8;
      color: white;
      border: none;
    }

    .btn-kasir:hover {
      background: #bd6f8d;
      color: white;
    }

    .total-bayar {
      background: #fff7fa;
      border-radius: 12px;
      padding: 16px;
    }

    @media (max-width: 900px) {
      .kasir-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container-fluid py-4 px-3 px-lg-4">

    <!-- HEADER -->
    <header class="d-flex justify-content-between align-items-center
                  flex-wrap gap-3 mb-4">
      <div>
        <h3 class="fw-bold mb-1">Modul Kasir</h3>
        <p class="text-secondary mb-0">
          Kelola transaksi penjualan dengan mudah.
        </p>
      </div>
    
      <div class="d-flex flex-wrap gap-2">
        <a href="master-data.html#barang"
           class="btn btn-outline-secondary">
          <i class="bi bi-box-seam me-1"></i>
          Master Data
        </a>

        <a href="dashboard.html"
           class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i>
          Kembali ke Dashboard
        </a>
      </div>
    </header>

    <!-- AREA TRANSAKSI -->
    <main class="kasir-layout">

      <!-- KOLOM KIRI: PRODUK -->
      <section class="kasir-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0">Daftar Produk</h5>
          <span class="badge text-bg-light" id="jumlahProduk">
            0 produk
          </span>
        </div>

        <!-- PENCARIAN PRODUK -->
        <div class="input-group mb-4">
          <span class="input-group-text bg-white">
            <i class="bi bi-search"></i>
          </span>
          <input
            type="text"
            id="cariProduk"
            class="form-control"
            placeholder="Cari nama atau kode barang..."
          >
        </div>

        <!-- PRODUK AKAN DITAMPILKAN DI SINI -->
        <div class="row g-3" id="daftarProduk">
          <div class="col-12 text-center text-secondary py-5">
            Produk akan ditampilkan di sini.
          </div>
        </div>
      </section>

      <!-- KOLOM KANAN: KERANJANG -->
      <section class="kasir-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0">
            <i class="bi bi-cart3 me-2"></i>Keranjang
          </h5>

          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            id="btnKosongkan"
          >
            Kosongkan
          </button>
        </div>

        <!-- ITEM KERANJANG AKAN DITAMPILKAN DI SINI -->
        <div id="daftarKeranjang">
          <div class="text-center text-secondary py-5">
            <i class="bi bi-cart fs-1 d-block mb-2"></i>
            Keranjang masih kosong.
          </div>
        </div>

        <hr>

        <!-- RINGKASAN TRANSAKSI -->
        <div class="total-bayar">
          <div class="d-flex justify-content-between mb-2">
            <span>Total Belanja</span>
            <strong id="totalBelanja">Rp0</strong>
          </div>

          <label for="uangBayar" class="form-label mt-3">
            Uang Pembayaran (Rp)
          </label>
          <input
            type="number"
            id="uangBayar"
            class="form-control"
            min="0"
            step="1"
            placeholder="Masukkan nominal pembayaran"
          >

          <div class="d-flex justify-content-between mt-3">
            <span>Kembalian</span>
            <strong id="uangKembalian">Rp0</strong>
          </div>
        </div>

        <!-- TOMBOL TRANSAKSI -->
        <div class="d-grid gap-2 mt-3">
          <button
            type="button"
            class="btn btn-kasir py-2"
            id="btnCheckout"
          >
            <i class="bi bi-check-circle me-1"></i>
            Proses Pembayaran
          </button>

          <button
            type="button"
            class="btn btn-outline-secondary"
            id="btnCetakStruk"
            disabled
          >
            <i class="bi bi-printer me-1"></i>
            Cetak Struk
          </button>
        </div>

        <!-- PESAN STATUS -->
        <div
          id="pesanKasir"
          class="alert d-none mt-3 mb-0"
          role="alert"
        ></div>
      </section>
    </main>


<!-- Area struk yang akan ditampilkan saat dicetak -->
<section id="areaStruk" class="d-none"></section>

<style>
  @media print {
    body * {
      visibility: hidden !important;
    }

    #areaStruk,
    #areaStruk * {
      visibility: visible !important;
    }

    #areaStruk {
      display: block !important;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      color: #000;
      background: #fff;
      font-family: Arial, sans-serif;
      font-size: 12px;
    }

    #areaStruk .struk {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    #areaStruk table {
      width: 100%;
      border-collapse: collapse;
    }

    #areaStruk th,
    #areaStruk td {
      padding: 5px 0;
      text-align: left;
      vertical-align: top;
    }

    #areaStruk .angka {
      text-align: right;
    }

    #areaStruk .garis {
      border-top: 1px dashed #000;
      margin: 10px 0;
    }

    #areaStruk .tengah {
      text-align: center;
    }
  }
</style>

  </div>

  <!-- JavaScript proyek: urutannya penting -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/kasir.js"></script>
</body>
</html>
